name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ffmpeg, one set per platform, packed into the app's resources by the
  # build job.
  tools:
    name: tools ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
          - target: darwin-amd64
          - target: windows-amd64
          - target: linux-amd64
    steps:
      - name: fetch ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            darwin-arm64)
              curl -fsSL -o /tmp/f.gz https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64.gz
              gunzip -c /tmp/f.gz > out/ffmpeg
              chmod +x out/ffmpeg
              ;;
            darwin-amd64)
              curl -fsSL -o /tmp/f.gz https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64.gz
              gunzip -c /tmp/f.gz > out/ffmpeg
              chmod +x out/ffmpeg
              ;;
            windows-amd64)
              curl -fsSL -o /tmp/f.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
              unzip -j /tmp/f.zip "*/bin/ffmpeg.exe" -d out
              ;;
            linux-amd64)
              curl -fsSL -o /tmp/f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
              tar -xJf /tmp/f.tar.xz -C /tmp
              cp /tmp/ffmpeg-*/bin/ffmpeg out/
              chmod +x out/ffmpeg
              ;;
          esac
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: out
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            platform: darwin/arm64
          - os: macos-latest
            target: darwin-amd64
            platform: darwin/amd64
          - os: windows-latest
            target: windows-amd64
            platform: windows/amd64
          - os: ubuntu-latest
            target: linux-amd64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: resources/${{ matrix.target }}/bin
      - name: make the tool executable
        if: matrix.target != 'windows-amd64'
        shell: bash
        run: chmod +x resources/${{ matrix.target }}/bin/*
      - name: check the tool
        shell: bash
        run: |
          bin="resources/${{ matrix.target }}/bin/ffmpeg"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" -version | head -1
      - name: build
        shell: bash
        run: go tool mygo build -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: build
          if-no-files-found: error
      - name: pack
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          name="mygo-video-${GITHUB_REF_NAME}-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            darwin-*) ditto -c -k --sequesterRsrc --keepParent build/*.app "$name.zip" ;;
            windows-*) powershell -Command "Compress-Archive -Path build/* -DestinationPath '$name.zip'" ;;
            *) (cd build && zip -qr "../$name.zip" .) ;;
          esac
          ls -lh "$name.zip"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: zip-${{ matrix.target }}
          path: "*.zip"
          if-no-files-found: error

  # Publish the four zips when a version tag is pushed.
  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
