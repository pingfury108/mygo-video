name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ffmpeg and ffprobe, one set per platform, packed into the app's
  # resources by the build job.
  tools:
    name: tools ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
          - target: windows-amd64
          - target: linux-amd64
    steps:
      - name: fetch ffmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            darwin-arm64)
              curl -fsSL -o /tmp/f.zip https://www.osxexperts.net/ffmpeg71arm.zip
              curl -fsSL -o /tmp/p.zip https://www.osxexperts.net/ffprobe71arm.zip
              unzip -j /tmp/f.zip ffmpeg -d out
              unzip -j /tmp/p.zip ffprobe -d out
              chmod +x out/ffmpeg out/ffprobe
              ;;
            windows-amd64)
              curl -fsSL -o /tmp/f.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
              unzip -j /tmp/f.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe" -d out
              ;;
            linux-amd64)
              curl -fsSL -o /tmp/f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
              tar -xJf /tmp/f.tar.xz -C /tmp
              cp /tmp/ffmpeg-*/bin/ffmpeg out/
              cp /tmp/ffmpeg-*/bin/ffprobe out/
              chmod +x out/ffmpeg out/ffprobe
              ;;
          esac
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: out
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            platform: darwin/arm64
          - os: windows-latest
            target: windows-amd64
            platform: windows/amd64
          - os: ubuntu-latest
            target: linux-amd64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: resources/${{ matrix.target }}/bin
      - name: build
        shell: bash
        run: go tool mygo build -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: build
          if-no-files-found: error
