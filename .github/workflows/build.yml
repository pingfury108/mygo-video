name: build

on:
  # A version tag publishes a release; anything else is run by hand.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ffmpeg, one set per platform, packed into the app's resources by the
  # build job.
  tools:
    name: tools ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
          - target: darwin-amd64
          - target: windows-amd64
          - target: linux-amd64
    steps:
      - name: fetch ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            darwin-arm64)
              curl -fsSL -o /tmp/f.gz https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64.gz
              gunzip -c /tmp/f.gz > out/ffmpeg
              chmod +x out/ffmpeg
              ;;
            darwin-amd64)
              curl -fsSL -o /tmp/f.gz https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64.gz
              gunzip -c /tmp/f.gz > out/ffmpeg
              chmod +x out/ffmpeg
              ;;
            windows-amd64)
              # 7.1, from gyan.dev: the master builds want NVENC API 13.1 and a
              # 610 driver, which most machines here do not have yet.
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/f.zip https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip
              unzip -j /tmp/f.zip "*/bin/ffmpeg.exe" -d out
              # mpv, which decodes in hardware what Media Foundation cannot.
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mpv.7z https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z
              7z e /tmp/mpv.7z mpv.exe -oout -y
              # The shared libavcodec the GPU decoder links, whose headers sit in
              # internal/gpudecode/ffmpeg/include: the same release, so the ABIs
              # match.
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/shared.7z https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z
              7z e /tmp/shared.7z "ffmpeg-*/bin/avcodec-*.dll" "ffmpeg-*/bin/avformat-*.dll" "ffmpeg-*/bin/avutil-*.dll" "ffmpeg-*/bin/swresample-*.dll" -oout -y
              ;;
            linux-amd64)
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar -xJf /tmp/f.tar.xz -C /tmp
              cp /tmp/ffmpeg-*/bin/ffmpeg out/
              chmod +x out/ffmpeg
              ;;
          esac
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: out
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            platform: darwin/arm64
          - os: macos-latest
            target: darwin-amd64
            platform: darwin/amd64
          - os: windows-latest
            target: windows-amd64
            platform: windows/amd64
          - os: ubuntu-latest
            target: linux-amd64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install mingw, which cgo needs on Windows
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: resources/${{ matrix.target }}/bin
      - name: make the tool executable
        if: matrix.target != 'windows-amd64'
        shell: bash
        run: chmod +x resources/${{ matrix.target }}/bin/*
      - name: place the dlls the gpu decoder links and loads
        if: matrix.target == 'windows-amd64'
        shell: bash
        run: |
          # The linker takes the DLLs from the decoder's own directory,
          # which the checkout lacks, under their lib prefix, which -lavcodec-63
          # finds; beside the exe they load at runtime by their plain names.
          mkdir -p internal/gpudecode/ffmpeg/bin
          cd resources/windows-amd64/bin
          for d in avcodec-63 avformat-63 avutil-61 swresample-7; do cp "$d.dll" "lib$d.dll"; done
          cp lib*.dll ../../../internal/gpudecode/ffmpeg/bin/
          cp avcodec-63.dll avformat-63.dll avutil-61.dll swresample-7.dll ../
      - name: check the tool
        shell: bash
        run: |
          bin="resources/${{ matrix.target }}/bin/ffmpeg"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" -version | head -1
      - name: build
        env:
          # Signs the update manifests and archives the app reads.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          # The GPU decoder links libavcodec through cgo, which mygo build
          # leaves out unless the environment asks for it.
          CGO_ENABLED: ${{ matrix.target == 'windows-amd64' && '1' || '0' }}
        shell: bash
        run: go tool mygo build -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
      # 0.10 puts the installers under build/<target>: a dmg, a setup exe,
      # a deb, an rpm and a tarball.
      - name: pack
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="build/${{ matrix.target }}"
          mkdir -p dist
          for f in "$dir"/*.dmg "$dir"/*setup*.exe "$dir"/*.deb "$dir"/*.rpm \
                   "$dir"/*.tar.gz "$dir"/update-*.json "$dir"/*.delta; do
            cp "$f" dist/
          done
          ls -lh dist
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: dist-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # Publish the installers when a version tag is pushed.
  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: pack official plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for manifest in examples/*/plugin.json; do
            dir=$(dirname "$manifest")
            id=$(jq -r '.id // empty' "$manifest")
            case "$id" in
              ""|*[!A-Za-z0-9._-]*)
                echo "bad plugin id: $id" >&2
                exit 1
                ;;
            esac
            asset="plugin-$id.zip"
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/$asset" .)
            sha=$(sha256sum "dist/$asset" | awk '{print $1}')
            jq --arg asset "$asset" --arg sha "$sha" \
              '{id,name,version,apiVersion:(.apiVersion // 1),
                minAppVersion:(.minAppVersion // ""),description:(.description // ""),
                playback:(.playback // "stream"),permissions:(.permissions // {}),
                login:(.login != null),asset:$asset,sha256:$sha}' \
              "$manifest" > "dist/.manifest-$id.json"
          done
          jq -s '{schema: 1, plugins: map(select(.id != null))}' \
            dist/.manifest-*.json > dist/plugins.json
          rm dist/.manifest-*.json
          cat dist/plugins.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
